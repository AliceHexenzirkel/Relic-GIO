# Builds Relic's two native components from a clean checkout and offers the results as artifacts:
#   ee        the in-game enhancements DLL (entertainment_experience/mod, CLibrary.dll), one job per game
#             version, through entertainment_experience/tools/build_ee.ps1
#   injector  the Win11 injector (the injector/mhynot2 submodule: launcher.exe + mhynot2.dll) through the
#             CMake wrapper in injector/, linked with the static C runtime
# The local counterpart is build\build_dlls.ps1. Nothing here is committed or copied into payload/: the
# step summary compares every hash with the committed payload file, and payload/ is updated by hand
# (build_dlls.ps1 -CopyToPayload) after an in-game test.
#
# No output may depend on the Visual C++ redistributable of the player's PC: a job fails when its file
# imports a Visual C++ runtime DLL (build/pe_imports.ps1, the rule build/publish.ps1 applies to payload/
# at every ship build).
#
# Toolset: the project files name v145 (MSVC 14.5x). A runner without it builds with v143 (the Visual
# Studio 2022 images); the job picks whichever is installed and names it in the artifact.
#
#   Manual:    Actions -> "DLL builds" -> Run workflow (runner label, game versions, injector yes/no).
#   Automatic: every push and pull request that touches the native sources or these build files.

name: DLL builds

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (a label whose image carries Visual Studio 2026 builds with v145)'
        type: string
        required: false
        default: windows-2025
      versions:
        description: 'Game versions of the enhancements DLL, space-separated (16 28 33)'
        type: string
        required: false
        default: '16 28'
      build_injector:
        description: 'Build the injector too'
        type: boolean
        required: false
        default: true
  push:
    paths:
      - 'entertainment_experience/mod/**'
      - 'entertainment_experience/tools/build_ee.ps1'
      - 'injector/**'
      - 'build/build_dlls.ps1'
      - 'build/pe_imports.ps1'
      - '.github/workflows/dlls.yml'
  pull_request:
    paths:
      - 'entertainment_experience/mod/**'
      - 'entertainment_experience/tools/build_ee.ps1'
      - 'injector/**'
      - 'build/build_dlls.ps1'
      - 'build/pe_imports.ps1'
      - '.github/workflows/dlls.yml'

permissions:
  contents: read

jobs:
  # The version list is a string input (or the default); the matrix below needs it as a JSON array.
  versions:
    name: Version list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - id: list
        env:
          VERSIONS: ${{ inputs.versions || '16 28' }}
        run: |
          # Commas and blanks separate the versions; only all-digit words count. The step's shell runs with
          # pipefail, and grep exits 1 when nothing matches: that exit is swallowed inside the group so the
          # empty list reaches the message below instead of aborting the assignment.
          list=$( (printf '%s\n' $(echo "$VERSIONS" | tr ',' ' ') | grep -E '^[0-9]+$' || true) | jq -R . | jq -cs .)
          if [ "$list" = "[]" ]; then echo "no game version in '$VERSIONS' (expected e.g. '16 28')"; exit 1; fi
          echo "matrix=$list" >> "$GITHUB_OUTPUT"
          echo "versions: $list"

  ee:
    name: CLibrary.dll v${{ matrix.version }}
    needs: versions
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      # Build the committed bytes: the runner's Git would otherwise check text files out CRLF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Pick the MSVC toolset
        id: toolset
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'no Visual Studio instance with MSBuild on this runner' }
          $msvc = @(Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue | ForEach-Object Name | Sort-Object -Descending)
          $toolset = if (@($msvc | Where-Object { $_ -match '^14\.5\d' }).Count -gt 0) { 'v145' } else { 'v143' }
          "Visual Studio: $vs"
          "MSVC toolsets: $($msvc -join ', ')"
          "PlatformToolset: $toolset"
          "toolset=$toolset" >> $env:GITHUB_OUTPUT

      # The matrix value travels as an environment variable, never pasted into the script text.
      - name: Build (entertainment_experience/tools/build_ee.ps1)
        env:
          GAME_VERSION: ${{ matrix.version }}
          TOOLSET: ${{ steps.toolset.outputs.toolset }}
        run: ./entertainment_experience/tools/build_ee.ps1 -Versions $env:GAME_VERSION -Config Release -Toolset $env:TOOLSET

      # The summary line carries the hash, the comparison with the committed payload file and the
      # imports; a Visual C++ runtime DLL among them fails the job (launcher.exe cannot report a failed
      # LoadLibrary: on a PC without the Visual C++ redistributable the menu would just be absent).
      - name: Compare with the committed payload, imports
        env:
          GAME_VERSION: ${{ matrix.version }}
          TOOLSET: ${{ steps.toolset.outputs.toolset }}
        run: |
          $dll = Get-Item "entertainment_experience/mod/bin/v$env:GAME_VERSION/Release-x64/CLibrary.dll"
          $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $map = @{ '16' = '1.6'; '28' = '2.8' }
          $verdict = 'no payload entry for this game version'
          if ($map.ContainsKey($env:GAME_VERSION)) {
            $payload = "payload/$($map[$env:GAME_VERSION])/ee/CLibrary.dll.bin"
            if (Test-Path $payload) {
              $committed = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
              $verdict = if ($committed -eq $sha) { "same as $payload" } else { "differs from $payload (``$committed``)" }
            } else {
              $verdict = "$payload is not committed"
            }
          }
          . ./build/pe_imports.ps1
          $imports = @(Get-PeImports $dll.FullName)
          $line = "CLibrary.dll, GameVersion $env:GAME_VERSION, $env:TOOLSET`: $([math]::Round($dll.Length / 1MB, 1)) MB, SHA-256 ``$sha`` - $verdict; imports $($imports -join ', ')"
          $line
          $line >> $env:GITHUB_STEP_SUMMARY
          $vc = @(Get-VcRuntimeImports $dll.FullName)
          if ($vc.Count -gt 0) { throw "CLibrary.dll depends on the Visual C++ redistributable: it imports $($vc -join ', ')" }

      # Kept 7 days: on a private repository artifacts count against the account's Actions storage.
      - uses: actions/upload-artifact@v7
        with:
          name: CLibrary-v${{ matrix.version }}-${{ steps.toolset.outputs.toolset }}
          path: |
            entertainment_experience/mod/bin/v${{ matrix.version }}/Release-x64/CLibrary.dll
            entertainment_experience/mod/bin/v${{ matrix.version }}/Release-x64/CLibrary.map
          retention-days: 7
          if-no-files-found: error

  injector:
    name: launcher.exe + mhynot2.dll
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_injector }}
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The developer shell of the runner's Visual Studio puts cl.exe, link.exe and the SDK in reach of
      # CMake and Ninja (both on the runner's PATH). The summary lists per output the hash, the comparison
      # with the committed payload file (equal only when the runner's compiler is the one that built the
      # committed files) and the imports; an output that imports a Visual C++ runtime DLL fails the job.
      - name: Build (injector/CMakeLists.txt, static CRT), hashes and imports
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'no Visual Studio instance with the MSVC x64 tools on this runner' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=amd64 -host_arch=amd64'
          cmake --version
          ninja --version
          cmake -S injector -B injector/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRELIC_STATIC_CRT=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }
          cmake --build injector/build
          if ($LASTEXITCODE -ne 0) { throw "cmake --build failed (exit $LASTEXITCODE)" }
          . ./build/pe_imports.ps1
          $needRuntime = @()
          foreach ($pair in @(@('launcher.exe', 'launcher.exe.bin'), @('mhynot2.dll', 'mhynot2.dll.bin'))) {
            $f = Get-Item "injector/build/$($pair[0])"
            $payload = "payload/common/ayy/anime/build/$($pair[1])"
            $sha = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $committed = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
            $verdict = if ($committed -eq $sha) { "same as $payload" } else { "differs from $payload (``$committed``)" }
            $imports = @(Get-PeImports $f.FullName)
            $line = "- $($f.Name) (static CRT): $([math]::Round($f.Length / 1KB)) KB, SHA-256 ``$sha`` - $verdict; imports $($imports -join ', ')"
            $line
            $line >> $env:GITHUB_STEP_SUMMARY
            $vc = @(Get-VcRuntimeImports $f.FullName)
            if ($vc.Count -gt 0) { $needRuntime += "$($f.Name) imports $($vc -join ', ')" }
          }
          if ($needRuntime.Count -gt 0) { throw "the injector depends on the Visual C++ redistributable: $($needRuntime -join '; ')" }

      - uses: actions/upload-artifact@v7
        with:
          name: injector-static-crt
          path: |
            injector/build/launcher.exe
            injector/build/mhynot2.dll
          retention-days: 7
          if-no-files-found: error
